<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orion | Product Demo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A short look at Project Orion in the field.">
<link rel="icon" href="../favicon.ico" sizes="any">
<meta property="og:type" content="video.other">
<meta property="og:title" content="Orion | Product Demo">
<meta property="og:description" content="A short look at Project Orion in the field.">
<meta property="og:image" content="https://orion.imxp.org/media/photos/orion-demo-poster.jpg">
<meta property="og:url" content="https://orion.imxp.org/demo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060E19; --ink:#FCFAF7;
  --muted:rgba(252,250,247,.68); --faint:rgba(252,250,247,.14);
  --green:#80FCA7;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:radial-gradient(120% 90% at 50% 0%, #0d1b2e 0%, var(--bg) 60%, #040a12 100%);
  color:var(--ink); font-family:var(--sans); font-weight:300;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  height:100vh; display:flex; flex-direction:column; align-items:center;
  padding:18px 20px; gap:14px;
}
header{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:8px}
.logo{height:20px;width:auto;opacity:.92}
.eyebrow{font-family:var(--mono); text-transform:uppercase; letter-spacing:.14em; font-size:11px; color:var(--green); margin:0}
.stage{flex:1 1 auto; width:100%; min-height:0; display:flex; align-items:center; justify-content:center}
.player{
  position:relative; width:100%; height:100%; max-width:calc((100vh - 110px) * 16 / 9);
  aspect-ratio:16/9; border-radius:14px; overflow:hidden;
  background:#0B1424; box-shadow:0 30px 80px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.4);
  border:1px solid rgba(252,250,247,.1);
}
.player video{width:100%;height:100%;object-fit:cover;display:block;background:#0B1424}
.play{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:76px; height:76px; border-radius:50%; border:2px solid var(--green);
  background:rgba(6,14,25,.45); cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.play::after{
  content:""; margin-left:6px; border-style:solid; border-color:transparent transparent transparent var(--ink);
  border-width:14px 0 14px 22px;
}
.play[hidden]{display:none}
footer{flex:0 0 auto; font-family:var(--mono); text-transform:uppercase; letter-spacing:.08em; font-size:11px; color:var(--muted); opacity:.85; text-align:center}
.back{color:var(--green); text-decoration:none; border-bottom:1px solid rgba(128,252,167,.4)}
.back:hover{border-color:var(--green)}
</style>
</head>
<body>
  <header>
    <img class="logo" src="../media/logos/orion-wordmark.png" alt="Orion">
    <p class="eyebrow">Product demo</p>
  </header>
  <div class="stage">
    <div class="player">
      <video id="demoVideo" preload="metadata" playsinline poster="../media/photos/orion-demo-poster.jpg" aria-label="Project Orion demo"></video>
      <button type="button" class="play" id="playBtn" aria-label="Play the demo"></button>
    </div>
  </div>
  <footer>Confidential &middot; Orion &middot; <a class="back" href="/">Back to the deck</a></footer>
  <script>
    var vid = document.getElementById('demoVideo'), play = document.getElementById('playBtn');
    vid.src = '../media/fiab.mp4';
    play.addEventListener('click', function () { play.hidden = true; vid.controls = true; vid.play(); });
  </script>
</body>
</html>
