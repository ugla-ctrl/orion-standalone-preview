<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orion | Product Demo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A short look at Project Orion in the field.">
<link rel="icon" href="../favicon.ico" sizes="any">
<meta property="og:type" content="video.other">
<meta property="og:title" content="Orion | Product Demo">
<meta property="og:description" content="A short look at Project Orion in the field.">
<meta property="og:image" content="https://orion.imxp.org/media/photos/orion-demo-poster.jpg">
<meta property="og:url" content="https://orion.imxp.org/demo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060E19; --ink:#FCFAF7;
  --muted:rgba(252,250,247,.68); --faint:rgba(252,250,247,.14);
  --green:#80FCA7;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:radial-gradient(120% 90% at 50% 0%, #0d1b2e 0%, var(--bg) 60%, #040a12 100%);
  color:var(--ink); font-family:var(--sans); font-weight:300;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  height:100vh; display:flex; flex-direction:column; align-items:center;
  padding:18px 20px; gap:14px;
}
header{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:8px}
.logo{height:20px;width:auto;opacity:.92}
.eyebrow{font-family:var(--mono); text-transform:uppercase; letter-spacing:.14em; font-size:11px; color:var(--green); margin:0}
.stage{flex:1 1 auto; width:100%; min-height:0; display:flex; align-items:center; justify-content:center}
.player{
  position:relative; width:100%; height:100%; max-width:calc((100vh - 110px) * 16 / 9);
  aspect-ratio:16/9; border-radius:14px; overflow:hidden;
  background:#0B1424; box-shadow:0 30px 80px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.4);
  border:1px solid rgba(252,250,247,.1);
}
.player video{width:100%;height:100%;object-fit:cover;display:block;background:#0B1424}
.play{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:76px; height:76px; border-radius:50%; border:2px solid var(--green);
  background:rgba(6,14,25,.45); cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.play::after{
  content:""; margin-left:6px; border-style:solid; border-color:transparent transparent transparent var(--ink);
  border-width:14px 0 14px 22px;
}
.play[hidden]{display:none}
footer{flex:0 0 auto; font-family:var(--mono); text-transform:uppercase; letter-spacing:.08em; font-size:11px; color:var(--muted); opacity:.85; text-align:center}
.back{color:var(--green); text-decoration:none; border-bottom:1px solid rgba(128,252,167,.4)}
.back:hover{border-color:var(--green)}
.rotate-hint{display:none}
@media (orientation:portrait) and (max-width:820px){
  body.show-rotate-hint .rotate-hint{
    display:flex; position:fixed; inset:0; z-index:50; background:rgba(6,14,25,.94);
    flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:32px;
  }
}
.rotate-icon{font-size:40px; animation:rotateHintSpin 1.8s ease-in-out infinite}
@keyframes rotateHintSpin{0%,100%{transform:rotate(0deg)}50%{transform:rotate(90deg)}}
.rotate-hint p{font-family:var(--sans); font-size:16px; color:var(--ink); margin:0; max-width:260px; line-height:1.4}
.rotate-dismiss{
  font-family:var(--mono); text-transform:uppercase; letter-spacing:.08em; font-size:11px; color:var(--green);
  background:transparent; border:1px solid rgba(128,252,167,.4); border-radius:999px; padding:10px 18px; cursor:pointer;
}
.rotate-dismiss:hover{border-color:var(--green)}

/* email gate (same look as the concept page overlay) */
#ecap{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(6,14,25,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:opacity .35s}
#ecap.out{opacity:0;pointer-events:none}
#ecap.hide{display:none}
#ecap .card{width:min(400px,100%);background:rgba(11,22,38,.92);border:1px solid var(--faint);border-radius:14px;padding:32px 26px 24px;text-align:center}
#ecap img{height:26px;width:auto;margin:0 auto 18px;display:block}
#ecap h2{font-size:21px;font-weight:400;line-height:1.3;margin:0 0 8px}
#ecap p{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 20px}
#ecap form{display:flex;flex-direction:column;gap:10px}
#ecap input{width:100%;padding:13px 15px;border-radius:9px;border:1px solid var(--faint);background:rgba(252,250,247,.06);color:var(--ink);font-size:16px;font-family:inherit;outline:none}
#ecap input:focus{border-color:rgba(252,250,247,.5)}
#ecap input::placeholder{color:var(--muted)}
#ecap button{width:100%;padding:13px;min-height:44px;border-radius:9px;border:0;cursor:pointer;background:var(--green);color:var(--bg);font-size:15px;font-family:inherit}
#ecap button:hover{opacity:.9}
#ecap .err{color:#ff8a8a;font-size:13px;min-height:16px;text-align:left;margin:0}
#ecap .fine{color:var(--muted);opacity:.75;font-size:12px;margin:14px 0 0}
</style>
</head>
<body>
<div id="ecap" role="dialog" aria-modal="true" aria-labelledby="ecapH">
  <div class="card">
    <img src="../media/logos/orion-wordmark.png" alt="Orion">
    <h2 id="ecapH">Watch the Orion demo.</h2>
    <p>Enter your email to open the demo.</p>
    <form id="ecapForm" novalidate>
      <input id="ecapEmail" type="email" placeholder="you@email.com" autocomplete="email" aria-label="Email address">
      <p class="err" id="ecapErr"></p>
      <button type="submit">Continue</button>
    </form>
    <p class="fine">We'll only use it to stay in touch about Orion.</p>
  </div>
</div>
<script>
(function(){
  var KEY='orion_demo_email',SUPA_URL='https://qmxhsendoepqeyeolzil.supabase.co',SUPA_KEY='sb_publishable_qU4HH0buJWQW3_RJk3QlYg_5r84ZfdP';
  var box=document.getElementById('ecap');
  function H(){return {'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};}
  function track(email){
    try{
      var SID=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2));
      var ms=0,last=(document.visibilityState==='visible'?Date.now():null),sent=-1;
      function tick(){if(last!==null){ms+=Math.min(Date.now()-last,60000);last=Date.now();}}
      function send(k){tick();var s=Math.round(ms/1000);if(s<3||s===sent)return;sent=s;
        fetch(SUPA_URL+'/rest/v1/rpc/deck_view_beat',{method:'POST',keepalive:!!k,headers:H(),body:JSON.stringify({p_deck:'orion-demo',p_session_id:SID,p_email:email,p_seconds:s})}).catch(function(){});}
      document.addEventListener('visibilitychange',function(){tick();last=document.visibilityState==='visible'?Date.now():null;if(document.visibilityState==='hidden')send(true);});
      setInterval(function(){send(false);},20000);addEventListener('pagehide',function(){send(true);});
    }catch(_){}
  }
  var saved=null;try{saved=localStorage.getItem(KEY);}catch(_){}
  if(saved){box.classList.add('hide');track(saved);return;}
  var form=document.getElementById('ecapForm'),input=document.getElementById('ecapEmail'),err=document.getElementById('ecapErr'),re=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  form.addEventListener('submit',function(e){
    e.preventDefault();var v=input.value.trim();
    if(!re.test(v)){err.textContent='Please enter a valid email address.';input.focus();return;}
    err.textContent='';
    try{localStorage.setItem(KEY,v);}catch(_){}
    fetch(SUPA_URL+'/rest/v1/orion_deck_leads',{method:'POST',keepalive:true,headers:Object.assign(H(),{'Prefer':'return=minimal'}),
      body:JSON.stringify({email:v,name:null,source:'orion-demo-gate',referrer:document.referrer||null,user_agent:navigator.userAgent})}).catch(function(){});
    box.classList.add('out');setTimeout(function(){box.classList.add('hide');},400);
    track(v);
  });
  setTimeout(function(){try{input.focus({preventScroll:true});}catch(_){}},300);
})();
</script>
  <header>
    <img class="logo" src="../media/logos/orion-wordmark.png" alt="Orion">
    <p class="eyebrow">Product demo</p>
  </header>
  <div class="stage">
    <div class="player">
      <video id="demoVideo" preload="metadata" playsinline poster="../media/photos/orion-demo-poster.jpg" aria-label="Project Orion demo"></video>
      <button type="button" class="play" id="playBtn" aria-label="Play the demo"></button>
    </div>
  </div>
  <footer>Confidential &middot; Orion &middot; <a class="back" href="/">Back to the deck</a></footer>
  <div class="rotate-hint" id="rotateHint">
    <div class="rotate-icon">&#128260;</div>
    <p>Turn your device sideways for the best view of the demo.</p>
    <button type="button" class="rotate-dismiss" id="rotateDismiss">Continue anyway</button>
  </div>
  <script>
    var vid = document.getElementById('demoVideo'), play = document.getElementById('playBtn');
    vid.src = '../media/fiab.mp4';
    play.addEventListener('click', function () { play.hidden = true; vid.controls = true; vid.play(); });

    (function () {
      var dismissed = sessionStorage.getItem('orionDemoRotateDismissed') === '1';
      if (!dismissed) document.body.classList.add('show-rotate-hint');
      document.getElementById('rotateDismiss').addEventListener('click', function () {
        sessionStorage.setItem('orionDemoRotateDismissed', '1');
        document.body.classList.remove('show-rotate-hint');
      });
      window.addEventListener('orientationchange', function () {
        setTimeout(function () {
          if (window.matchMedia('(orientation: landscape)').matches) {
            document.body.classList.remove('show-rotate-hint');
          }
        }, 300);
      });
    })();
  </script>
</body>
</html>
